name: Deploy Learnora Fullstack

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: Deploy Backend with SAM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SAM_DEPLOY_BUCKET: ${{ secrets.SAM_DEPLOY_BUCKET }}
        run: |
          sam deploy \
            --template-file infra/template.yaml \
            --stack-name learnora-stack \
            --s3-bucket $SAM_DEPLOY_BUCKET \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-5 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Upload Frontend to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # Get the bucket name from stack outputs
          FRONTEND_BUCKET=$(aws cloudformation describe-stack-resources \
            --stack-name learnora-stack \
            --region ap-southeast-5 \
            --query "StackResources[?LogicalResourceId=='FrontendBucket'].PhysicalResourceId" \
            --output text)

          echo "Uploading frontend files to bucket: $FRONTEND_BUCKET"

          # Disable Block Public Access at bucket level
          aws s3api put-public-access-block \
            --bucket $FRONTEND_BUCKET \
            --public-access-block-configuration '{
              "BlockPublicAcls": false,
              "IgnorePublicAcls": false,
              "BlockPublicPolicy": false,
              "RestrictPublicBuckets": false
            }' \
            --region ap-southeast-5

          # Upload frontend files with public-read ACL
          aws s3 sync frontend/ s3://$FRONTEND_BUCKET --delete --region ap-southeast-5 --acl public-read

      - name: Print stack outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws cloudformation describe-stacks \
            --stack-name learnora-stack \
            --region ap-southeast-5 \
            --query "Stacks[0].Outputs" \
            --output table
