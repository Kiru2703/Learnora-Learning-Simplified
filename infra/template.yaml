AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Learnora — AWS Bedrock proxy (Lambda + API Gateway + Frontend Hosting)

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        AWS_REGION_NAME: ap-southeast-5
        BEDROCK_MODEL_ID: global.anthropic.claude-haiku-4-5-20251001-v1:0
        MAX_TOKENS: "2048"
        ALLOWED_ORIGINS: "*"

Resources:

  # ── IAM Role for Lambda ──────────────────────────────────────
  LearnoraLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: learnora-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
        - arn:aws:iam::aws:policy/AmazonAPIGatewayAdministrator
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  # ── Lambda function ──────────────────────────────────────────
  LearnoraBedrockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: learnora-bedrock-proxy
      Handler: lambda_handler.handler        # file.function
      CodeUri: ../backend                    # points to backend folder
      Description: Proxies Learnora AI requests to AWS Bedrock (Claude 3 Haiku)
      Role: !GetAtt LearnoraLambdaRole.Arn   # use the role defined above
      Events:
        ChatPost:
          Type: Api
          Properties:
            RestApiId: !Ref LearnoraApi
            Path: /chat
            Method: POST
        ChatOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LearnoraApi
            Path: /chat
            Method: OPTIONS

  # ── API Gateway ──────────────────────────────────────────────
  LearnoraApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: learnora-api
      StageName: prod
      Cors:
        AllowMethods: "'POST, OPTIONS'"
        AllowHeaders: "'Content-Type, Authorization'"
        AllowOrigin: "'*'"

  # ── S3 Bucket for Frontend ───────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: lab-sam-deploy-kiru-2703
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      AccessControl: PublicRead

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint — paste this into frontend/index.html as LEARNORA_API_URL"
    Value: !Sub "https://${LearnoraApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt LearnoraBedrockFunction.Arn

  FrontendURL:
    Description: "S3 Website endpoint for Learnora frontend"
    Value: !GetAtt FrontendBucket.WebsiteURL
