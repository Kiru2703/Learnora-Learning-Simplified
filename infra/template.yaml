AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Learnora — AWS Bedrock proxy (Lambda + API Gateway)

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        AWS_REGION_NAME: ap-southeast-2
        BEDROCK_MODEL_ID: global.anthropic.claude-haiku-4-5-20251001-v1:0
        MAX_TOKENS: "2048"
        ALLOWED_ORIGINS: "*"

Resources:

  # ── Lambda function ──────────────────────────────────────
  LearnoraBedrockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: learnora-bedrock-proxy
      Handler: lambda_handler.handler        # file.function
      CodeUri: backend                       # points to backend folder
      Description: Proxies Learnora AI requests to AWS Bedrock (Claude 3 Haiku)
      Role: arn:aws:iam::443407534411:role/LabRole   # replace with your sandbox LabRole ARN
      Events:
        ChatPost:
          Type: Api
          Properties:
            RestApiId: !Ref LearnoraApi
            Path: /chat
            Method: POST
        ChatOptions:
          Type: Api
          Properties:
            RestApiId: !Ref LearnoraApi
            Path: /chat
            Method: OPTIONS

  # ── API Gateway ──────────────────────────────────────────
  LearnoraApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: learnora-api
      StageName: prod
      Cors:
        AllowMethods: "'POST, OPTIONS'"
        AllowHeaders: "'Content-Type, Authorization'"
        AllowOrigin: "'*'"

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint — paste this into frontend/index.html as LEARNORA_API_URL"
    Value: !Sub "https://${LearnoraApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt LearnoraBedrockFunction.Arn
